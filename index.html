<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2D47C4">
<meta name="description" content="Ежедневный тренажёр для подготовки к собеседованию на фронтенд-разработчика">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тренажёр">
<title>Фронтенд-тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Раскладка: одна колонка-приложение до 560px, шапка сверху, таб-бар снизу у большого пальца */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#E9ECF1; --line:#D8DCE3;
  --fg:#14161B; --muted:#5B606B;
  --accent:#2D47C4; --accent-fg:#FFFFFF; --accent-soft:#E3E7F9;
  --ok:#157A46; --ok-soft:#DFF2E7; --bad:#B93424; --bad-soft:#FAE5E1;
  --code-bg:#1A1D25; --code-fg:#E4E7EE; --code-str:#E5B567; --code-num:#9CB2FF; --code-kw:#F09A8C; --code-com:#7D8494;
  --flame:#E07A1F; --flame-soft:#FCEBDA;
  --f-ui:"Golos Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --surface:#171A20; --surface-2:#20242C; --line:#2B3039;
  --fg:#ECEEF2; --muted:#9AA0AC;
  --accent:#8B9EFF; --accent-fg:#0D1020; --accent-soft:#1F2647;
  --ok:#4BC488; --ok-soft:#12301F; --bad:#FF7B6B; --bad-soft:#3A1915;
  --code-bg:#0A0C10; --code-fg:#E4E7EE; --flame:#FFA64D; --flame-soft:#3A2512; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1115; --surface:#171A20; --surface-2:#20242C; --line:#2B3039;
  --fg:#ECEEF2; --muted:#9AA0AC;
  --accent:#8B9EFF; --accent-fg:#0D1020; --accent-soft:#1F2647;
  --ok:#4BC488; --ok-soft:#12301F; --bad:#FF7B6B; --bad-soft:#3A1915;
  --code-bg:#0A0C10; --code-fg:#E4E7EE; --flame:#FFA64D; --flame-soft:#3A2512; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.55 var(--f-ui);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.mono{font-family:var(--f-mono)}
.tnum{font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 10px}
.brand{font:600 15px/1.2 var(--f-mono);letter-spacing:-.01em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){.brand span{display:none}}
.brand span{color:var(--muted);font-weight:400}
.streak{font:600 13px/1 var(--f-mono);padding:7px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.streak b{color:var(--accent)}
main{flex:1;padding:4px 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{border:0;background:none;padding:8px 4px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);min-height:52px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:20px;line-height:1.25;font-weight:700}
.card h3{font-size:16px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}

.btn{border:0;border-radius:8px;min-height:48px;padding:0 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-fg);transition:transform .15s ease,opacity .15s ease}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.line{background:none;border:1px solid var(--line);color:var(--fg)}
.btn.block{width:100%}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}

.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}
.bar.ok i{background:var(--ok)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font:600 22px/1.1 var(--f-mono)}
.stat span{font-size:12.5px;color:var(--muted)}

/* квиз */
.qhead{display:flex;align-items:center;gap:12px}
.qhead .bar{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--f-mono);padding:6px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.chip.gen{background:var(--accent-soft);color:var(--accent)}
.qtext{font-size:19px;line-height:1.4;font-weight:600}
pre.code{margin:0;background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:14px;overflow-x:auto;font:400 14px/1.6 var(--f-mono);tab-size:2}
pre.code .s{color:var(--code-str)} pre.code .n{color:var(--code-num)} pre.code .k{color:var(--code-kw)} pre.code .c{color:var(--code-com);font-style:italic}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;min-height:52px;transition:border-color .15s ease,background-color .15s ease}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .l{flex:none;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font:600 13px/1 var(--f-mono);background:var(--surface-2);color:var(--muted)}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);color:#fff}
.fb{border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb h3{font-size:16px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb .lbl{font:600 13px/1.4 var(--f-ui);color:var(--muted)}
.fb .lbl b{font-family:var(--f-mono);color:var(--fg)}
.ai{border-left:3px solid var(--accent);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.ai pre.code{font-size:13px}

/* памятка */
.search{width:100%;min-height:48px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.note .tag{font:600 11.5px/1 var(--f-mono);color:var(--accent)}

/* темы */
.topic{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px}
.topic .bar{grid-column:1/-1}
.topic b{font-weight:600}

/* прогресс */
.chart{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:120px}
.chart .col{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:0;position:relative}
.chart .tot{background:var(--surface-2);border-radius:3px 3px 0 0;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;min-height:2px}
.chart .okp{background:var(--ok)}
.chart-lbl{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font:400 10.5px/1 var(--f-mono);color:var(--muted);text-align:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:12.5px}
td.r,th.r{text-align:right}
.mistake{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.mistake>button{width:100%;border:0;background:none;text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.mistake .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.pill{font:600 11.5px/1 var(--f-mono);padding:4px 7px;border-radius:5px}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.empty{text-align:center;padding:24px 8px;color:var(--muted)}
/* ударный режим и опыт */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.ring{width:92px;height:92px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .trk{stroke:var(--surface-2)}
.ring .val{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.7,.2,1)}
.ring.full .val{stroke:var(--ok)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:600 20px/1 var(--f-mono)}
.flame{width:18px;height:18px;flex:none}
.flame path{fill:var(--muted)}
.flame.on path{fill:var(--flame)}
.streak{display:inline-flex;align-items:center;gap:6px}
.streak.on{background:var(--flame-soft);border-color:transparent}
.streak.on b{color:var(--flame)}
.xpchip{white-space:nowrap;font:600 13px/1 var(--f-mono);padding:7px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.topr{display:flex;gap:6px;align-items:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week .d{display:flex;flex-direction:column;align-items:center;gap:5px;font:500 11.5px/1 var(--f-mono);color:var(--muted)}
.week .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:2px solid transparent}
.week .dot svg{width:15px;height:15px}
.week .done .dot{background:var(--flame);color:#fff}
.week .part .dot{border-color:var(--flame);background:var(--flame-soft)}
.week .today .dot{border-color:var(--fg)}
.week .done.today .dot{border-color:var(--flame)}
.risk{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--flame-soft)}
.combo{font:600 12px/1 var(--f-mono);padding:6px 8px;border-radius:6px;background:var(--flame-soft);color:var(--flame);white-space:nowrap}
.float{position:absolute;right:10px;top:-9px;background:var(--surface);padding:3px 6px;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.15);font:700 15px/1 var(--f-mono);color:var(--ok);pointer-events:none;animation:floatUp 1s ease-out forwards}
.opt{position:relative}
.opt.right{animation:pop .35s ease}
.opt.wrong{animation:shake .4s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
.celebrate{text-align:center;align-items:center;background:linear-gradient(var(--flame-soft),var(--surface) 70%)}
.celebrate .big{width:64px;height:64px}
.celebrate .num{font:700 44px/1 var(--f-mono);color:var(--flame)}
.lvl{display:flex;align-items:center;gap:10px}
.lvl .bar{flex:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
@media (prefers-reduced-motion: reduce){.opt.right,.opt.wrong,.float{animation:none}}
.chip.lv1{background:var(--ok-soft);color:var(--ok)}
.chip.lv2{background:var(--accent-soft);color:var(--accent)}
.chip.lv3{background:var(--bad-soft);color:var(--bad)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-2);padding:4px;border-radius:8px}
.seg button{border:0;background:none;border-radius:6px;min-height:40px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.link.dk{align-self:center;font-weight:500;color:var(--muted);padding:6px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">frontend<span>.тренажёр</span></div>
    <div class="topr"><span class="xpchip tnum" id="xp">Ур. 1</span><div class="streak tnum" id="streak">0</div></div>
  </header>
  <main id="view" aria-live="polite"></main>
  <nav class="tabs" aria-label="Разделы">
    <div class="tabs-in">
      <button class="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 15l2.5 2.5L16 13"/></svg>Сегодня</button>
      <button class="tab" data-tab="topics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6l-6 6 6 6M16 6l6 6-6 6"/></svg>Темы</button>
      <button class="tab" data-tab="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11l5 5v11H4z"/><path d="M15 4v5h5M8 13h8M8 17h5"/></svg>Памятка</button>
      <button class="tab" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Прогресс</button>
    </div>
  </nav>
</div>

<script>
// Пакет «основы»: самые простые вопросы для старта (уровень 1). w — почему неверен каждый вариант.
const QUESTIONS0 = [

 o:['Подключает адаптивные стили','Говорит мобильному браузеру не масштабировать страницу как десктопную','Запрещает зум','Ускоряет загрузку'],a:1,
 e:'Без этого тега телефон рисует страницу шириной около 980px и уменьшает её, и медиазапросы не срабатывают как задумано.'},
{id:'h5',t:'html',k:'case',q:'В форме заявки на телефоне выскакивает буквенная клавиатура для поля «Телефон». Как исправить?',
 o:['type="number"','type="tel"','pattern="[0-9]"','inputmode="text"'],a:1,
 e:'type="tel" открывает цифровую клавиатуру. number не подходит: он убирает плюс и ведущие нули и показывает стрелки.'},
{id:'h6',t:'html',k:'theory',q:'Что даёт атрибут loading="lazy" у img?',
 o:['Картинка загрузится, когда пользователь до неё доскроллит','Картинка сжимается','Картинка грузится в низком качестве','Ничего, это устаревший атрибут'],a:0,
 e:'Ленивая загрузка экономит трафик. Для картинки на первом экране lazy не ставят, иначе она появится позже.'},
{id:'h7',t:'html',k:'theory',q:'Какой тег подходит для основной навигации сайта?',
 o:['div class="menu"','nav','menu','header'],a:1,
 e:'Семантические теги (header, nav, main, footer, article) помогают поисковикам и скринридерам понять структуру страницы.'},
{id:'h8',t:'html',k:'theory',q:'Сколько заголовков h1 рекомендуется на странице?',
 o:['Сколько угодно','Один, главный заголовок страницы','Ни одного','По одному в каждой секции'],a:1,
 e:'Один h1 с главной темой страницы, дальше h2 и h3 по иерархии без пропусков уровней.'},
{id:'h9',t:'html',k:'theory',q:'Для чего нужен атрибут srcset у картинки?',
 o:['Для подписи','Браузер выбирает файл подходящего размера под экран','Для анимации','Для ленивой загрузки'],a:1,
 e:'Телефону не нужно качать картинку шириной 2400px. srcset и sizes позволяют отдать файл под экран.'},
{id:'h10',t:'html',k:'theory',q:'Что делает атрибут required у поля формы?',
 o:['Делает поле жирным','Браузер не отправит форму, пока поле пустое','Добавляет звёздочку','Сохраняет значение'],a:1,
 e:'Это встроенная валидация браузера. Проверку на сервере она не заменяет.'},

// ---------- CSS ----------
{id:'c1',t:'css',k:'theory',q:'У элемента есть id="title" и class="heading". Правила #title { color: red } и .heading { color: blue }. Какого цвета текст?',
 o:['Синего','Красного','Зависит от порядка в файле','Фиолетового'],a:1,
 e:'Селектор по id специфичнее селектора по классу, поэтому он побеждает независимо от порядка.'},
{id:'c2',t:'css',k:'theory',q:'width: 200px; padding: 20px; box-sizing: border-box. Какая итоговая ширина блока?',
 o:['200px','240px','220px','160px'],a:0,
 e:'При border-box padding и рамка входят в заданную ширину. При content-box блок стал бы 240px.'},
{id:'c3',t:'css',k:'case',q:'Нужно отцентрировать блок по горизонтали и вертикали внутри родителя. Самый простой способ?',
 o:['margin: auto у ребёнка','display: flex; justify-content: center; align-items: center у родителя','text-align: center','position: center'],a:1,
 e:'Ещё короче: display: grid; place-items: center.'},
{id:'c4',t:'css',k:'theory',q:'Относительно чего позиционируется элемент с position: absolute?',
 o:['Относительно окна браузера','Относительно ближайшего предка с position, отличным от static','Относительно родителя всегда','Относительно body'],a:1,
 e:'Поэтому родителю обычно ставят position: relative.'},
{id:'c5',t:'css',k:'theory',q:'Чем rem отличается от em?',
 o:['Ничем','rem считается от размера шрифта html, em — от размера шрифта текущего элемента','em считается от html','rem — только для отступов'],a:1,
 e:'rem предсказуем. em удобен, когда размер должен зависеть от шрифта самого компонента, например отступы кнопки.'},
{id:'c6',t:'css',k:'case',q:'Поставил z-index: 999, но элемент всё равно под другим блоком. Что проверить первым?',
 o:['Увеличить до 9999','Есть ли у элемента position (не static) и не создаёт ли родитель свой контекст наложения','Поставить !important','Перенести CSS выше'],a:1,
 e:'z-index работает у позиционированных элементов и flex/grid-детей. Родитель с transform, opacity < 1 или своим z-index создаёт контекст, выше которого ребёнок не поднимется.'},
{id:'c7',t:'css',k:'theory',q:'Что делает grid-template-columns: repeat(3, 1fr)?',
 o:['Три строки','Три колонки равной ширины','Три колонки по 1px','Повторяет элемент три раза'],a:1,
 e:'fr — доля свободного места. Для адаптива удобно repeat(auto-fit, minmax(240px, 1fr)).'},
{id:'c8',t:'css',k:'case',q:'На телефоне у страницы появилась горизонтальная прокрутка. Как найти виновника?',
 o:['Поставить body { overflow-x: hidden } и забыть','В DevTools найти элемент шире экрана: картинка без max-width, фиксированная ширина, длинное слово, flex-ребёнок без min-width: 0','Удалить медиазапросы','Уменьшить шрифт'],a:1,
 e:'overflow-x: hidden прячет симптом, но может сломать position: sticky. Надёжнее найти и исправить сам элемент.'},
{id:'c9',t:'css',k:'theory',q:'Чем display: none отличается от visibility: hidden?',
 o:['Ничем','none убирает элемент из потока, hidden оставляет пустое место','hidden убирает из потока','none можно анимировать'],a:1,
 e:'Для анимированного появления обычно используют opacity и visibility, потому что display не анимируется.'},
{id:'c10',t:'css',k:'theory',q:'Какие свойства лучше анимировать для плавности?',
 o:['width и height','top и left','transform и opacity','margin'],a:2,
 e:'transform и opacity не вызывают пересчёт раскладки страницы и обрабатываются видеокартой.'},
{id:'c11',t:'css',k:'theory',q:'Что делает font-size: clamp(1rem, 2.5vw, 2rem)?',
 o:['Фиксирует 2rem','Размер растёт с шириной экрана, но не меньше 1rem и не больше 2rem','Обрезает текст','Работает только на мобильных'],a:1,
 e:'clamp(минимум, предпочтительное, максимум) — удобный способ сделать адаптивную типографику без медиазапросов.'},
{id:'c12',t:'css',k:'theory',q:'Что делает object-fit: cover у картинки?',
 o:['Растягивает с искажением','Заполняет блок целиком без искажения, обрезая лишнее','Вписывает целиком с полями','Делает картинку фоном'],a:1,
 e:'Часто вместе с object-position, чтобы обрезка не съела главное в кадре.'},
{id:'c13',t:'css',k:'theory',q:'Подход mobile-first в медиазапросах — это…',
 o:['Писать базовые стили для телефона и расширять их через min-width','Писать стили для десктопа и уменьшать через max-width','Делать только мобильную версию','Использовать только vw'],a:0,
 e:'Базовые стили проще, а сложная раскладка добавляется для широких экранов.'},
{id:'c14',t:'css',k:'case',q:'Карточки в flex-ряду: длинное слово в одной из них растягивает ряд и ломает вёрстку. Что поможет?',
 o:['min-width: 0 у flex-ребёнка и overflow-wrap: anywhere у текста','display: block','float: left','width: 100vw'],a:0,
 e:'По умолчанию flex-ребёнок не сжимается меньше своего содержимого (min-width: auto).'},
{id:'c15',t:'css',k:'theory',q:'Почему соседние вертикальные отступы margin иногда «схлопываются»?',
 o:['Это баг браузера','Вертикальные margin соседних блочных элементов объединяются в больший из двух','Из-за box-sizing','Из-за flex'],a:1,
 e:'Внутри flex и grid схлопывания нет. Поэтому расстояния между элементами удобно задавать через gap.'},

// ---------- Браузер и сеть ----------
{id:'w1',t:'web',k:'theory',q:'Что означает статус ответа 404?',
 o:['Ошибка сервера','Ресурс не найден','Нет доступа','Перенаправление'],a:1,
 e:'2xx — успех, 3xx — перенаправление (301 навсегда, 302 временно), 4xx — ошибка запроса (403 нет доступа, 404 не найдено), 5xx — ошибка сервера.'},
{id:'w2',t:'web',k:'theory',q:'Что такое CORS?',
 o:['Формат картинок','Правила браузера, разрешающие или запрещающие запросы к другому домену','Протокол шифрования','Тип базы данных'],a:1,
 e:'Чужой сервер должен явно разрешить запросы с вашего домена заголовком Access-Control-Allow-Origin. Исправляется на сервере, а не во фронтенде.'},
{id:'w3',t:'web',k:'case',q:'Обновил CSS на сайте, а заказчик говорит, что ничего не изменилось. Скорее всего…',
 o:['Изменения не сохранились','Браузер или плагин кэша отдаёт старый файл: жёсткая перезагрузка, сброс кэша, версия в ссылке style.css?v=2','Нужно перезагрузить сервер','Сломан CSS'],a:1,
 e:'В WordPress версию файла задают в wp_enqueue_style, а кэширующие плагины тоже нужно очищать.'},
{id:'w4',t:'web',k:'case',q:'Сайт переехал на HTTPS, и часть картинок пропала, а в консоли ругань Mixed Content. Что делать?',
 o:['Вернуть HTTP','Заменить ссылки http:// на https:// в базе и шаблонах','Отключить SSL','Очистить кэш браузера'],a:1,
 e:'Браузер блокирует небезопасные ресурсы на защищённой странице. В WordPress ссылки меняют через поиск и замену в базе.'},
{id:'w5',t:'web',k:'theory',q:'Чем GET отличается от POST?',
 o:['Ничем','GET получает данные и передаёт параметры в адресе, POST отправляет данные в теле запроса','POST быстрее','GET безопаснее для паролей'],a:1,
 e:'Пароли и данные форм отправляют через POST: параметры GET остаются в истории браузера и логах сервера.'},
{id:'w6',t:'web',k:'theory',q:'Где лучше хранить токен авторизации, чтобы JavaScript на странице не мог его прочитать?',
 o:['localStorage','Cookie с флагом HttpOnly','В переменной window','В sessionStorage'],a:1,
 e:'HttpOnly-cookie недоступна из JS, и это защищает токен от кражи при XSS.'},
{id:'w7',t:'web',k:'case',q:'Форма на сайте «ничего не делает». С чего начать?',
 o:['Переписать форму с нуля','Открыть DevTools: Console (ошибки JS) и Network (ушёл ли запрос и какой ответ)','Позвонить хостеру','Сменить браузер'],a:1,
 e:'Console и Network показывают 90 % проблем с формами: ошибку скрипта, 404 обработчика, 500 сервера.'},
{id:'w8',t:'web',k:'theory',q:'Что такое DNS?',
 o:['Хостинг','Система, которая переводит домен в IP-адрес сервера','Сертификат безопасности','Почтовый сервер'],a:1,
 e:'После смены DNS-записей домен может открываться по-старому до суток, пока обновляются кэши.'},
{id:'w9',t:'web',k:'theory',q:'Метрика LCP из Core Web Vitals показывает…',
 o:['Сдвиги вёрстки','Время отрисовки самого крупного элемента первого экрана','Время ответа сервера','Скорость отклика на клик'],a:1,
 e:'LCP — загрузка, CLS — сдвиги вёрстки, INP — отзывчивость на действия. Хороший LCP — до 2,5 секунды.'},
{id:'w10',t:'web',k:'code',q:'Что произойдёт?',code:`JSON.parse("{ name: 'Иван' }");`,out:'SyntaxError',
 o:['Вернёт объект','SyntaxError','Вернёт строку','undefined'],a:1,
 e:'В JSON ключи и строки обязательно в двойных кавычках: {"name": "Иван"}.'},

// ---------- Git ----------
{id:'g1',t:'git',k:'theory',q:'Правильный порядок, чтобы отправить изменения на GitHub?',
 o:['git push → git commit → git add','git add → git commit → git push','git commit → git add → git push','git pull → git push'],a:1,
 e:'add добавляет файлы в индекс, commit фиксирует снимок, push отправляет коммиты на сервер.'},
{id:'g2',t:'git',k:'theory',q:'Что делает git pull?',
 o:['Отправляет коммиты','Скачивает изменения с сервера и вливает их в текущую ветку','Удаляет ветку','Создаёт копию репозитория'],a:1,
 e:'pull = fetch + merge. Если хочется сначала посмотреть изменения, делают git fetch.'},
{id:'g3',t:'git',k:'theory',q:'Как создать новую ветку и сразу на неё переключиться?',
 o:['git branch new','git switch -c new','git merge new','git push new'],a:1,
 e:'Старый вариант той же команды: git checkout -b new.'},
{id:'g4',t:'git',k:'case',q:'Сделал коммит с ошибкой и ещё не отправил его. Как отменить коммит, сохранив изменения в файлах?',
 o:['git reset --soft HEAD~1','git reset --hard HEAD~1','Удалить папку .git','git push --force'],a:0,
 e:'--soft отменяет коммит, а изменения остаются подготовленными. --hard удаляет изменения безвозвратно.'},
{id:'g5',t:'git',k:'case',q:'Ошибочный коммит уже отправлен в общую ветку. Как безопасно отменить его?',
 o:['git reset --hard и git push --force','git revert <хеш коммита>','Удалить репозиторий','Написать коллегам, чтобы не скачивали'],a:1,
 e:'revert создаёт новый коммит с обратными изменениями и не переписывает историю, которую уже скачали другие.'},
{id:'g6',t:'git',k:'theory',q:'Зачем нужен файл .gitignore?',
 o:['Хранит пароли','Перечисляет файлы, которые Git не должен отслеживать: node_modules, .env, кэш','Отключает Git','Описывает проект'],a:1,
 e:'Пароли и ключи (wp-config.php с данными базы, .env) никогда не должны попадать в репозиторий.'},
{id:'g7',t:'git',k:'case',q:'При git pull возник конфликт. Что делать?',
 o:['Удалить репозиторий и склонировать заново','Открыть файлы с конфликтом, выбрать нужные строки между <<<<<<< и >>>>>>>, затем git add и git commit','git push --force','Игнорировать'],a:1,
 e:'Конфликт — это когда Git не знает, какую версию строк оставить. Решает человек, VS Code показывает удобные кнопки.'},
{id:'g8',t:'git',k:'theory',q:'Что показывает git status?',
 o:['Историю коммитов','Изменённые, подготовленные и неотслеживаемые файлы и текущую ветку','Список веток на сервере','Автора проекта'],a:1,
 e:'История коммитов — это git log, удобно в виде git log --oneline.'},

// ---------- WordPress и PHP ----------
{id:'wp1',t:'wp',k:'theory',q:'Как правильно подключить свой CSS в теме WordPress?',
 o:['Тегом link в header.php','Через wp_enqueue_style в functions.php на хуке wp_enqueue_scripts','Через @import в style.css','Вставить стили в каждый шаблон'],a:1,
 e:'Так WordPress управляет зависимостями, версиями и порядком подключения, и плагины не дублируют библиотеки.'},
{id:'wp2',t:'wp',k:'theory',q:'Какой шаблон WordPress использует для главной страницы, если он есть в теме?',
 o:['index.php','front-page.php','page.php','home.html'],a:1,
 e:'Иерархия шаблонов: front-page.php → home.php (лента записей) → index.php. Для страниц page.php, для записей single.php.'},
{id:'wp3',t:'wp',k:'theory',q:'Чем get_field() отличается от the_field() в ACF?',
 o:['Ничем','get_field возвращает значение, the_field сразу выводит его','the_field работает только в цикле','get_field устарел'],a:1,
 e:'get_field нужен, когда значение надо проверить или обработать перед выводом: if ($phone = get_field("phone")) ...'},
{id:'wp4',t:'wp',k:'theory',q:'Зачем нужна дочерняя тема?',
 o:['Для мобильной версии','Чтобы правки не стёрлись при обновлении родительской темы','Для скорости','Для мультиязычности'],a:1,
 e:'В дочерней теме переопределяют только нужные файлы, остальное берётся из родительской.'},
{id:'wp5',t:'wp',k:'case',q:'После правки functions.php сайт показывает белый экран или «критическую ошибку». Что делать?',
 o:['Переустановить WordPress','Через файловый менеджер хостинга или FTP откатить правку, включить WP_DEBUG и посмотреть ошибку','Удалить базу данных','Ждать, само пройдёт'],a:1,
 e:'Чаще всего это синтаксическая ошибка: пропущенная точка с запятой или скобка. Поэтому крупные правки делают на копии сайта.'},
{id:'wp6',t:'wp',k:'theory',q:'Какой функцией безопасно выводить текст из поля в HTML?',
 o:['echo $text','echo esc_html($text)','print_r($text)','echo strip_tags($text)'],a:1,
 e:'Для атрибутов esc_attr, для ссылок esc_url. Экранирование защищает от XSS.'},
{id:'wp7',t:'wp',k:'case',q:'Сайт перенесли на новый домен, и в базе остались старые ссылки. Почему опасно делать замену простым SQL REPLACE?',
 o:['Это не опасно','Часть данных хранится сериализованной, и при изменении длины строки она ломается','SQL не умеет заменять','База удалится'],a:1,
 e:'Правильно: WP-CLI search-replace или плагин Better Search Replace, они учитывают сериализацию.'},
{id:'wp8',t:'wp',k:'case',q:'Письма из формы Contact Form 7 не доходят до заказчика. Частое решение?',
 o:['Переустановить CF7','Настроить отправку через SMTP (плагин WP Mail SMTP) с реальным почтовым ящиком','Сменить тему','Отключить кэш'],a:1,
 e:'Стандартная функция mail() на хостинге часто попадает в спам или блокируется. SMTP отправляет письма через настоящий почтовый сервер.'},
{id:'wp9',t:'wp',k:'theory',q:'Как вывести последние 3 записи произвольного типа «project»?',
 o:['get_posts без параметров','new WP_Query([ "post_type" => "project", "posts_per_page" => 3 ])','query_posts("project")','SQL-запрос в шаблоне'],a:1,
 e:'После своего цикла WP_Query вызывают wp_reset_postdata(), чтобы вернуть глобальный $post.'},
{id:'wp10',t:'wp',k:'code',q:'Что выведет PHP-код?',code:`$name = 'Сергей';
echo 'Привет, $name';`,out:'Привет, $name',
 o:['Привет, Сергей','Привет, $name','Ошибку','Привет, '],a:1,
 e:'В одинарных кавычках PHP не подставляет переменные. Подстановка работает в двойных: "Привет, $name".'},

// ---------- Скорость и доступность ----------
{id:'p1',t:'perf',k:'case',q:'PageSpeed ругается на тяжёлые картинки. Что сделать в первую очередь?',

{id:'wp14',t:'wp',k:'case',q:'Нужен блок «Преимущества», где заказчик сам добавляет любое количество пунктов с иконкой и текстом. Какое поле ACF подходит?',

{id:'wp15',t:'wp',k:'case',q:'Телефон и адрес компании выводятся в шапке и подвале на всех страницах. Где удобнее дать заказчику их редактировать?',

{id:'wp16',t:'wp',k:'theory',q:'Для чего нужен wp_nonce в формах и AJAX-запросах WordPress?',

{id:'wp18',t:'wp',k:'case',q:'На сайт заказчика попал вредоносный код: появились редиректы на чужие сайты. Что делать первым?',

{id:'wp19',t:'wp',k:'theory',q:'Что делает get_template_part("parts/card")?',

{id:'wp21',t:'wp',k:'case',q:'После обновления плагина на сайте сломалась вёрстка. Как быстро найти виновника?',

{id:'w13',t:'web',k:'theory',q:'Для чего phpMyAdmin?',

{id:'dom19',t:'dom',k:'case',q:'Мобильное меню открывается по кнопке-бургеру. Что нужно для доступности?',

  if (state.mode && state.mode !== 'auto') hint = 'Уровень выбран вручную. В режиме «Авто» сложность растёт сама.';
  else if (next) { const st = levelStats(next.from); hint = 'До уровня «' + LEVEL_NAMES[L + 1] + '»: ' + Math.min(st.learned, next.need) + ' из ' + next.need + ' верно отвеченных вопросов, точность ' + Math.round(st.acc * 100) + '% (нужно 70%).'; }
  else hint = 'Открыты все уровни. В задании смешиваются лёгкие, средние и сложные вопросы.';
  const progressFrac = next && (!state.mode || state.mode === 'auto') ? Math.min(1, levelStats(next.from).learned / next.need) : 1;
  const diffCard = h('div', { class: 'card' },
    h('div', { class: 'spread' }, h('h3', {}, 'Сложность'), h('span', { class: 'chip lv' + L }, LEVEL_NAMES[L])),
    h('div', { class: 'seg', role: 'radiogroup', 'aria-label': 'Режим сложности' }, ...[['auto', 'Авто'], ['1', 'Лёгкий'], ['2', 'Средний'], ['3', 'Сложный']].map(([v, label]) =>
      h('button', { role: 'radio', 'aria-checked': String((state.mode || 'auto') === v), onclick: () => { state.mode = v; const d = state.days[today()]; if (d) d.v = 0; save(); go('today'); } }, label))),
    bar(progressFrac),
    h('p', { class: 'small muted' }, hint));
  return [main, strk, diffCard, rev, lvl, tipCard, stats];
}

function viewTopics() {
  const rows = Object.entries(TOPICS).map(([key, name]) => {
    const qs = bank().filter(q => q.t === key);
    const seen = qs.filter(q => ans(q.id)).length;
    const a = qs.map(q => ans(q.id)).filter(Boolean);
    const c = a.reduce((s, x) => s + x.c, 0), n = a.reduce((s, x) => s + x.c + x.w, 0);
    return h('button', { class: 'topic', onclick: () => startQuiz('practice', practiceSet(key), name) },
      h('b', {}, name), h('span', { class: 'mono small tnum muted' }, n ? Math.round(c / n * 100) + '%' : '—'),
      h('span', { class: 'small muted', style: 'grid-column:1/-1' }, seen + ' из ' + qs.length + ' пройдено'),
      bar(qs.length ? seen / qs.length : 0));
  });
  const out = [h('h2', { style: 'font-size:22px' }, 'Темы'), h('p', { class: 'muted small' }, 'Нажми на тему, чтобы пройти 10 вопросов по ней. Сначала идут новые, потом слабые.'), ...rows];
  if (ai.sample) {
    const sel = h('select', { id: 'gen-topic', class: 'search' }, ...Object.entries(TOPICS).map(([k, v]) => h('option', { value: k }, v)));
    const status = h('p', { class: 'small muted' }, 'Claude составит 5 новых вопросов по теме с разбором ошибок. Они сохранятся в тренажёре.');
    const btn = h('button', { class: 'btn block', onclick: () => generate(sel.value, status, btn) }, 'Сгенерировать 5 вопросов');
    out.push(h('div', { class: 'card' }, h('h3', {}, 'Новые вопросы от Claude'), sel, status, btn));
  }
  return out;
}
async function generate(topic, status, btn) {
  btn.disabled = true; status.textContent = 'Claude составляет вопросы… это может занять до минуты.';
  const existing = bank().filter(q => q.t === topic).map(q => '- ' + q.q.slice(0, 90)).slice(0, 40).join('\n');
  const prompt = 'Составь 5 новых вопросов для подготовки junior фронтенд-разработчика к собеседованию по теме «' + TOPICS[topic] + '». Пиши по-русски.\n'
    + 'Смешай типы: «что выведет код» (с коротким кодом), практические ситуации и теорию. У каждого вопроса ровно 4 варианта и один правильный. Проверь правильность ответа особенно тщательно.\n'
    + 'Ответь только JSON-массивом объектов вида {"q":"текст вопроса","code":"код или пустая строка","o":["вариант1","вариант2","вариант3","вариант4"],"a":0,"e":"объяснение правильного ответа 1–2 предложения","w":["почему вариант1 неверен или null для правильного", "...", "...", "..."]}.\n'
    + 'Не повторяй эти вопросы:\n' + existing;
  try {
    const data = await ai.sample.json(prompt, { cache: false });
    const stamp = Date.now().toString(36);
    const qs = (Array.isArray(data) ? data : []).filter(x => x && typeof x.q === 'string' && Array.isArray(x.o) && x.o.length === 4 && Number.isInteger(x.a) && x.a >= 0 && x.a < 4)
      .map((x, i) => ({ id: 'x' + stamp + i, t: topic, k: x.code ? 'code' : 'theory', gen: 1, d: 2, q: String(x.q), code: x.code ? String(x.code) : '', o: x.o.map(String), a: x.a, e: String(x.e || ''),
        w: Array.isArray(x.w) && x.w.length === 4 ? x.w.map((v, j) => j === x.a ? null : (v ? String(v) : '')) : null }));
    if (!qs.length) throw { code: 'invalid_json' };
    state.extra = [...state.extra, ...qs].slice(-80); save();
    status.textContent = 'Готово: ' + qs.length + ' ' + plural(qs.length, ['вопрос', 'вопроса', 'вопросов']) + '. Вопросы от Claude могут содержать неточности, сверяйся с объяснением.';
    startQuiz('practice', qs.map(q => q.id), TOPICS[topic]);
  } catch (e) {
    if (e.code === 'not_granted' || e.code === 'sampling_disabled' || e.code === 'not_declared') { ai.sample = null; status.textContent = 'Генерация через Claude отключена для этой страницы.'; }
    else status.textContent = e.code === 'rate_limited' ? 'Слишком много запросов, попробуй позже.' : 'Не получилось составить вопросы. Попробуй ещё раз.';
  }
  btn.disabled = false;
}

let notesFilter = 'all', notesQuery = '';
function viewNotes() {
  const list = h('div', { style: 'display:flex;flex-direction:column;gap:12px' });
  const draw = () => {
    const qn = notesQuery.trim().toLowerCase();
    const items = NOTES.filter(n => (notesFilter === 'all' || n.t === notesFilter) && (!qn || (n.h + ' ' + n.b + ' ' + (n.c || '')).toLowerCase().includes(qn)));
    list.replaceChildren(...(items.length ? items.map(n => h('article', { class: 'card note' },
      h('span', { class: 'tag' }, TOPICS[n.t]), h('h3', {}, n.h), h('p', {}, n.b), n.c ? codeBlock(n.c) : null))
      : [h('p', { class: 'empty' }, 'Ничего не нашлось. Попробуй другое слово.')]));
  };
  const input = h('input', { id: 'notes-search', class: 'search', type: 'search', placeholder: 'Поиск: flex, git, промис…', value: notesQuery, oninput: e => { notesQuery = e.target.value; draw(); } });
  const chips = h('div', { class: 'chips', role: 'group', 'aria-label': 'Фильтр по теме' },
    ...[['all', 'Все'], ...Object.entries(TOPICS)].map(([k, v]) => h('button', { 'aria-pressed': String(notesFilter === k), onclick: e => { notesFilter = k; chips.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', 'false')); e.currentTarget.setAttribute('aria-pressed', 'true'); draw(); } }, v)));
  draw();
  return [h('h2', { style: 'font-size:22px' }, 'Памятка'), input, chips, list];
}

function viewProgress() {
  const t = today();
  const days = Array.from({ length: 14 }, (_, i) => addDays(t, i - 13));
  const max = Math.max(5, ...days.map(d => state.days[d]?.n || 0));
  const chart = h('div', { class: 'chart', role: 'img', 'aria-label': 'Ответы за 14 дней' }, ...days.map(d => {
    const n = state.days[d]?.n || 0, ok = state.days[d]?.ok || 0;
    return h('div', { class: 'col', title: d + ': ' + n + ' ответов, ' + ok + ' верных' },
      h('div', { class: 'tot', style: 'height:' + (n / max * 100) + '%' }, h('div', { class: 'okp', style: 'height:' + (n ? ok / n * 100 : 0) + '%' })));
  }));
  const labels = h('div', { class: 'chart-lbl', 'aria-hidden': 'true' }, ...days.map(d => h('span', {}, String(Number(d.slice(8))))));
  const table = h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, 'Тема'), h('th', { class: 'r' }, 'Пройдено'), h('th', { class: 'r' }, 'Верно'))),
    h('tbody', {}, ...Object.entries(TOPICS).map(([k, v]) => {
      const qs = bank().filter(q => q.t === k), a = qs.map(q => ans(q.id)).filter(Boolean);
      const c = a.reduce((s, x) => s + x.c, 0), n = a.reduce((s, x) => s + x.c + x.w, 0);
      return h('tr', {}, h('td', {}, v), h('td', { class: 'r mono tnum' }, a.length + '/' + qs.length), h('td', { class: 'r mono tnum' }, n ? Math.round(c / n * 100) + '%' : '—'));
    })));
  const mistakes = state.mistakes.filter(m => byId(m.id));
  const mlist = h('div', { id: 'mistakes', style: 'display:flex;flex-direction:column;gap:8px' },
    ...(mistakes.length ? mistakes.map(m => {
      const q = byId(m.id), fixed = (ans(m.id)?.box || 0) >= 2;
      const body = h('div', { class: 'body', hidden: true },
        q.code ? codeBlock(q.code) : null,
        h('div', {}, h('p', { class: 'small', style: 'color:var(--bad);font-weight:600' }, m.p < 0 ? 'Ты выбрал «Не знаю»' : 'Твой ответ: ' + q.o[m.p]), m.p < 0 ? null : h('p', { class: 'small' }, whyFor(q, m.p))),
        h('div', {}, h('p', { class: 'small', style: 'color:var(--ok);font-weight:600' }, 'Правильно: ' + q.o[q.a]), h('p', { class: 'small' }, q.e)),
        h('button', { class: 'btn ghost', onclick: () => startQuiz('review', [q.id]) }, 'Ответить ещё раз'));
      const toggle = h('button', { 'aria-expanded': 'false', onclick: () => { body.hidden = !body.hidden; toggle.setAttribute('aria-expanded', String(!body.hidden)); } },
        h('span', { class: 'row' }, h('span', { class: 'pill ' + (fixed ? 'ok' : 'bad') }, fixed ? 'закреплено' : 'на повторе'), h('span', { class: 'small muted' }, TOPICS[q.t] + ' · ' + m.d.split('-').reverse().slice(0, 2).join('.'))),
        h('span', { style: 'font-weight:600' }, q.q));
      return h('div', { class: 'mistake' }, toggle, body);
    }) : [h('p', { class: 'empty' }, 'Ошибок пока нет. Когда ответишь неверно, здесь появится разбор: почему твой вариант не подходит и какой ответ правильный.')]));
  let confirmEl;
  const reset = h('button', { class: 'link', style: 'color:var(--bad)', onclick: () => {
    if (confirmEl) return;
    confirmEl = h('div', { class: 'card' }, h('p', {}, 'Удалить весь прогресс, серию и ошибки? Отменить будет нельзя.'),
      h('div', { class: 'row' },
        h('button', { class: 'btn', style: 'background:var(--bad);color:#fff', onclick: () => { state = blank(); save(); go('progress'); toast('Прогресс сброшен'); } }, 'Удалить'),
        h('button', { class: 'btn ghost', onclick: () => { confirmEl.remove(); confirmEl = null; } }, 'Отмена')));
    reset.after(confirmEl);
  } }, 'Сбросить прогресс');
  return [
    h('h2', { style: 'font-size:22px' }, 'Прогресс'),
    h('div', { class: 'card' }, h('h3', {}, 'Последние 14 дней'), chart, labels, h('p', { class: 'small muted' }, 'Высота столбика — сколько ответов за день, зелёная часть — сколько верных.')),
    h('div', { class: 'card' }, h('h3', {}, 'По темам'), h('div', { style: 'overflow-x:auto' }, table)),
    h('div', { class: 'card' }, h('div', { class: 'spread' }, h('h3', {}, 'Мои ошибки'), h('span', { class: 'mono tnum muted' }, mistakes.length)),
      h('p', { class: 'small muted' }, 'Нажми на вопрос, чтобы открыть разбор.'), mlist),
    h('p', { class: 'small muted' }, sync.mode === 'db' ? 'Прогресс сохраняется в аккаунте Claude и одинаков на всех устройствах.' : 'Прогресс хранится на этом устройстве.'),
    reset];
}

const VIEWS = { today: viewToday, topics: viewTopics, notes: viewNotes, progress: viewProgress };
function go(tab) {
  currentTab = tab; session = null;
  document.querySelectorAll('.tab').forEach(b => b.dataset.tab === tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  setView(...VIEWS[tab]());
  window.scrollTo(0, 0);
  try { localStorage.setItem(LS_KEY + '-tab', tab); } catch (e) {}
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));
addEventListener('keydown', e => {
  if (!session || e.target.closest('input,select,textarea')) return;
  const n = '1234'.indexOf(e.key); if (n >= 0 && !session.answered) { session.choose?.(n); }
});

/* ---------- старт ---------- */
let startTab = 'today';
try { const t = localStorage.getItem(LS_KEY + '-tab'); if (t && VIEWS[t]) startTab = t; } catch (e) {}
updateStreak(); go(startTab);

(async () => {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  const [db, user, sample] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('sample')]);
  if (sample) ai.sample = sample;
  if (db && user) {
    const uid = await user.id();
    if (uid) {
      try {
        const ref = db.doc('data/users/' + uid + '/progress');
        const snap = await ref.get();
        if (snap.exists) state = merge(snap.data(), state);
        sync.mode = 'db'; sync.ref = ref;
        if (!snap.exists && Object.keys(state.answers).length) save();
        try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
      } catch (e) { sync.mode = 'local'; }
    }
  }
  if (!session) { updateStreak(); go(currentTab); }
})();

if (IS_PWA && 'serviceWorker' in navigator && window.top === window) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
